<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Scoreboard Display</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="/firebase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#050505; user-select:none;
}

/* ═══ FULL-SCREEN 3-ROW GRID ═══ */
.scoreboard {
  width:100vw; height:100vh;
  display:grid;
  grid-template-rows: 22vh 58vh 20vh;
}

/* ══ ROW 1: CLOCK + TEAM NAMES ══ */
.row-clock {
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  background:#080808;
  border-bottom:2px solid #1c1c1c;
  overflow:hidden;
}
.team-header {
  display:flex; align-items:center; justify-content:center;
  padding:0 2vw;
  font-family:'Teko',sans-serif; font-size:5.5vw; font-weight:700;
  letter-spacing:0.3vw; text-transform:uppercase; color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,0.15);
}
.clock-wrap {
  display:flex; align-items:center; justify-content:center;
  padding:0 1vw;
}
.clock-digit {
  font-family:'Teko',sans-serif; font-size:20vh; font-weight:700;
  color:#ffaa00; line-height:1; text-align:center; min-width:6.5vw;
  text-shadow:0 0 40px rgba(255,170,0,0.5),0 0 80px rgba(255,130,0,0.15);
}
.clock-colon {
  font-family:'Teko',sans-serif; font-size:18vh; font-weight:700;
  color:#ffaa00; line-height:1; padding:0 0.3vw;
  text-shadow:0 0 40px rgba(255,170,0,0.5);
}

/* ══ ROW 2: SCORES + CENTER ══ */
.row-scores {
  display:grid;
  grid-template-columns: 1fr 18vw 1fr;
  background:#0a0a0a;
  border-bottom:2px solid #1c1c1c;
}
.team-block {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:1vh 1vw; position:relative; overflow:hidden;
}
.team-block.home::after {
  content:''; position:absolute; top:10%; right:0; bottom:10%;
  width:4px; border-radius:2px; background:var(--team-color,#f5c842);
  box-shadow:0 0 14px var(--team-color,#f5c842);
}
.team-block.away::before {
  content:''; position:absolute; top:10%; left:0; bottom:10%;
  width:4px; border-radius:2px; background:var(--team-color,#c8102e);
  box-shadow:0 0 14px var(--team-color,#c8102e);
}
.score-val {
  font-family:'Teko',sans-serif;
  font-size:clamp(8rem,54vh,44vw);
  font-weight:700; line-height:0.85;
  text-align:center; color:#ff2200;
  text-shadow:0 0 40px rgba(255,34,0,0.35);
  display:flex; align-items:center; justify-content:center;
  width:100%; flex:1;
}
@keyframes scoreBump {
  0%{transform:scale(1)}
  35%{transform:scale(1.1);color:#ff6600;text-shadow:0 0 50px rgba(255,100,0,0.9)}
  100%{transform:scale(1)}
}
.bump { animation:scoreBump 0.45s ease; }

/* Center column */
.center-col {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:1vh 0;
  border-left:1px solid #1c1c1c;
  border-right:1px solid #1c1c1c;
}
.lbl {
  font-family:'Teko',sans-serif; font-size:1.6vh; font-weight:700;
  color:#383838; letter-spacing:0.4vw; text-transform:uppercase; line-height:1;
}
.period-num {
  font-family:'Teko',sans-serif; font-size:22vh; font-weight:700;
  color:#00ee44; line-height:0.85; text-align:center;
  text-shadow:0 0 24px rgba(0,238,68,0.5);
}
.divider { width:60%; height:1px; background:#1c1c1c; margin:0.5vh 0; }
.shot-num {
  font-family:'Teko',sans-serif; font-size:18vh; font-weight:700;
  color:#ffaa00; line-height:0.85; text-align:center;
  text-shadow:0 0 24px rgba(255,170,0,0.5); transition:color 0.2s;
}
.shot-num.urgent {
  color:#ff2200;
  text-shadow:0 0 28px rgba(255,30,0,0.8);
  animation:urgentPulse 0.35s ease infinite alternate;
}
.shot-num.zero {
  color:#ff1122;
  text-shadow:0 0 28px rgba(255,0,0,0.9);
}
@keyframes urgentPulse { to{opacity:0.35} }

/* ══ ROW 3: FOULS + POSSESSION ══ */
.row-bottom {
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  background:#080808;
}
.fouls-block {
  display:flex; align-items:center; justify-content:center;
  gap:1.5vw; padding:0 3vw;
}
.fouls-lbl {
  font-family:'Teko',sans-serif; font-size:2.8vh; font-weight:700;
  color:#444; letter-spacing:0.4vw; text-transform:uppercase;
}
.fouls-val {
  font-family:'Teko',sans-serif; font-size:10vh; font-weight:700;
  color:#ff9900; line-height:1;
  text-shadow:0 0 16px rgba(255,153,0,0.5);
}

/* Possession */
.poss-wrap {
  display:flex; align-items:center; justify-content:center;
  gap:2vw; padding:0 2vw;
}
.poss-item {
  display:flex; align-items:center; gap:0.8vw;
  opacity:0.12; transition:opacity 0.3s;
}
.poss-item.on { opacity:1; }
.poss-logo {
  width:10vh; height:10vh; border-radius:50%;
  background:#111; border:3px solid #222;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; flex-shrink:0;
  transition:border-color 0.3s, box-shadow 0.3s;
}
.poss-logo img { width:88%; height:88%; object-fit:contain; }
.poss-logo-ph {
  font-family:'Teko',sans-serif; font-size:1.8vh; font-weight:700;
  color:#555; text-align:center; text-transform:uppercase; letter-spacing:1px;
}
.poss-item.on .poss-logo {
  box-shadow:0 0 16px rgba(255,136,0,0.9), 0 0 32px rgba(255,100,0,0.4);
}
.poss-arrow { display:flex; align-items:center; }
.poss-item.on .poss-arrow {
  filter:drop-shadow(0 0 6px #ff8800) drop-shadow(0 0 14px #ff6600);
}
.poss-item.home.on .poss-arrow { animation:arrowRight 0.9s ease-in-out infinite alternate; }
.poss-item.away.on .poss-arrow { animation:arrowLeft  0.9s ease-in-out infinite alternate; }
@keyframes arrowRight { from{transform:translateX(0)} to{transform:translateX(6px)} }
@keyframes arrowLeft  { from{transform:translateX(0)} to{transform:translateX(-6px)} }

/* Score flash */
.score-flash {
  position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0;
  background:radial-gradient(ellipse 60% 40% at 50% 55%,rgba(255,40,0,0.12),transparent 70%);
}
@keyframes flash { 0%{opacity:0} 15%{opacity:1} 100%{opacity:0} }
.flash-anim { animation:flash 0.7s ease forwards; }

/* Sound unlock */
#soundUnlock {
  position:fixed; inset:0; z-index:99999;
  background:rgba(0,0,0,0.9);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px; cursor:pointer;
}
#soundUnlock h2 { font-family:'Teko',sans-serif; font-size:6vh; color:#fff; letter-spacing:4px; text-transform:uppercase; }
#soundUnlock button {
  font-family:'Teko',sans-serif; font-size:4vh; font-weight:700;
  letter-spacing:3px; text-transform:uppercase;
  background:#c8102e; color:#fff; border:none;
  padding:22px 60px; border-radius:12px; cursor:pointer;
}

#fsBtn {
  position:fixed; bottom:16px; right:16px; z-index:9998;
  width:48px; height:48px; border-radius:50%;
  background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.15);
  color:#fff; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0.4; transition:opacity 0.2s;
}
#fsBtn:hover { opacity:1; }

/* ═══ PORTRAIT ORIENTATION ═══ */
@media (orientation: portrait) {
  .scoreboard {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  .row-clock {
    flex: 0 0 16vh;
    grid-template-columns: 1fr;
    justify-content: center;
    align-items: center;
  }
  .team-header { display: none; }
  .clock-digit { font-size: min(16vw, 13vh); min-width: 8vw; }
  .clock-colon { font-size: min(14vw, 11vh); }

  .row-scores {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .center-col {
    order: 2;
    flex: 0 0 11vh;
    flex-direction: row;
    gap: 12vw;
    border-left: none;
    border-right: none;
    border-top: 1px solid #1c1c1c;
    border-bottom: 1px solid #1c1c1c;
    background: #080808;
  }
  .center-col .divider { display: none; }
  .period-num { font-size: clamp(28px, 6vh, 48px); }
  .shot-num { font-size: clamp(32px, 7vh, 56px); }

  .team-block {
    flex: 1;
    padding: 1vh 4vw;
  }
  .team-block.away { order: 1; border-bottom: 1px solid #161616; }
  .team-block.home { order: 3; }
  .score-val { font-size: min(20vh, 36vw); line-height: 0.85; }

  .row-bottom {
    flex: 0 0 12vh;
    grid-template-columns: 1fr 1fr;
    padding: 0 4vw;
  }
  .poss-wrap {
    display: none;
  }
}
</style>
</head>
<body>

<div id="soundUnlock" onclick="unlockAudio()">
  <h2>🏀 Scoreboard Display</h2>
  <button>TAP TO ACTIVATE SOUND</button>
</div>
<button id="fsBtn" onclick="toggleFullscreen()">⛶</button>
<div class="score-flash" id="scoreFlash"></div>

<div class="scoreboard">

  <!-- ROW 1: CLOCK -->
  <div class="row-clock">
    <div class="team-header" id="guestNameEl">AWAY</div>
    <div class="clock-wrap">
      <div class="clock-digit" id="clkM1">1</div>
      <div class="clock-digit" id="clkM2">0</div>
      <div class="clock-colon">:</div>
      <div class="clock-digit" id="clkS1">0</div>
      <div class="clock-digit" id="clkS2">0</div>
    </div>
    <div class="team-header" id="homeNameEl">HOME</div>
  </div>

  <!-- ROW 2: SCORES -->
  <div class="row-scores">
    <div class="team-block away" id="awayBlock">
      <div class="score-val" id="awayScoreEl">0</div>
    </div>
    <div class="center-col">
      <div class="lbl">PERIOD</div>
      <div class="period-num" id="periodEl">1</div>
      <div class="divider"></div>
      <div class="lbl">SHOT</div>
      <div class="shot-num" id="shotEl">24</div>
    </div>
    <div class="team-block home" id="homeBlock">
      <div class="score-val" id="homeScoreEl">0</div>
    </div>
  </div>

  <!-- ROW 3: FOULS + POSSESSION -->
  <div class="row-bottom">
    <div class="fouls-block">
      <div class="fouls-val" id="awayFoulsEl">0</div>
      <div class="fouls-lbl">FOULS</div>
    </div>

    <div class="poss-wrap">
      <div class="poss-item away" id="possAway">
        <div class="poss-logo" id="possLogoAway"><div class="poss-logo-ph">AWY</div></div>
        <div class="poss-arrow">
          <svg viewBox="0 0 60 42" style="width:5vw;height:3.5vw;">
            <defs><radialGradient id="agAway" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="40%" stop-color="#ffcc00"/>
              <stop offset="100%" stop-color="#ff6600"/>
            </radialGradient></defs>
            <polygon points="4,21 56,3 56,39" fill="url(#agAway)"/>
          </svg>
        </div>
      </div>
      <div class="poss-item home" id="possHome">
        <div class="poss-arrow">
          <svg viewBox="0 0 60 42" style="width:5vw;height:3.5vw;">
            <defs><radialGradient id="agHome" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="40%" stop-color="#ffcc00"/>
              <stop offset="100%" stop-color="#ff6600"/>
            </radialGradient></defs>
            <polygon points="56,21 4,3 4,39" fill="url(#agHome)"/>
          </svg>
        </div>
        <div class="poss-logo" id="possLogoHome"><div class="poss-logo-ph">HME</div></div>
      </div>
    </div>

    <div class="fouls-block">
      <div class="fouls-lbl">FOULS</div>
      <div class="fouls-val" id="homeFoulsEl">0</div>
    </div>
  </div>

</div>

<script>
const isLocalServer = window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1' ||
                      window.location.hostname.startsWith('192.168.') ||
                      window.location.hostname.startsWith('10.');

const useFirebase = (typeof isFirebaseConfigured !== 'undefined' && isFirebaseConfigured) && !isLocalServer;

const SERVER_URL = useFirebase
  ? 'https://scoreboard.hoopculture.ca'
  : (window.location.protocol === 'file:' ? 'http://localhost:3000' : '');

let db = null;
if (useFirebase && typeof firebase !== 'undefined' && isFirebaseConfigured) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch(e) { console.warn('Firebase init failed:', e); }
}

const urlParams = new URLSearchParams(window.location.search);
const currentUser = urlParams.get('user') || localStorage.getItem('hc_session_user') || 'default';
const fbUser = currentUser.replace(/[\.\#\$\[\]]/g, '_');

let aiSyncActive = false;
let aiState = { gameSeconds: null, clockStr: null, homeScore: null, awayScore: null, quarter: null, shotSeconds: null };

let feedInvertMode = (urlParams.get('invert') === 'black' || urlParams.get('invert') === '1' || urlParams.get('black') === '1' || urlParams.get('feedInvert') === 'black')
  ? 'black'
  : (localStorage.getItem('hc_feed_invert_mode') || 'white');

function applyStreamImgStyles(img) {
  if (!img) return;
  img.style.border = 'none';
  img.style.outline = 'none';
  img.style.background = 'transparent';
  img.style.boxShadow = 'none';

  let isLightBg = false;
  try {
    if (img.naturalWidth > 0 && img.naturalHeight > 0) {
      const c = document.createElement('canvas');
      c.width = 4; c.height = 4;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 4, 4);
      const p = ctx.getImageData(0, 0, 1, 1).data;
      isLightBg = (p[0] * 0.299 + p[1] * 0.587 + p[2] * 0.114) > 140;
    }
  } catch(e) {}

  if (feedInvertMode === 'black') {
    img.style.mixBlendMode = 'multiply';
    img.style.filter = isLightBg ? 'contrast(2.5) brightness(1.3)' : 'invert(1) contrast(2.5) brightness(1.3)';
  } else {
    img.style.mixBlendMode = 'screen';
    img.style.filter = isLightBg ? 'invert(1) contrast(2.5) brightness(1.3)' : 'contrast(2.5) brightness(1.3)';
  }
}

function updateAllStreamImagesStyle() {
  document.querySelectorAll('img.stream-bin-img').forEach(applyStreamImgStyles);
}

function setFeedInvertMode(mode) {
  feedInvertMode = (mode === 'black') ? 'black' : 'white';
  try { localStorage.setItem('hc_feed_invert_mode', feedInvertMode); } catch(e) {}
  updateAllStreamImagesStyle();
}

function toggleFeedInvert() {
  setFeedInvertMode(feedInvertMode === 'black' ? 'white' : 'black');
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'i' || e.key === 'I') {
    toggleFeedInvert();
  }
});

function applyStreamData(data) {
  if (!data) return;
  if (data.feedInvert && data.feedInvert !== feedInvertMode) {
    setFeedInvertMode(data.feedInvert);
  }
  if (data.streamActive === false) {
    aiSyncActive = false;
    S.gameClockStream = null;
    S.homeScoreStream = null;
    S.awayScoreStream = null;
    S.periodStream = null;
    S.shotClockStream = null;
    render();
    return;
  }
  aiSyncActive = true;

  if (data.gameClockStream) S.gameClockStream = data.gameClockStream;
  if (data.homeScoreStream) S.homeScoreStream = data.homeScoreStream;
  if (data.awayScoreStream) S.awayScoreStream = data.awayScoreStream;
  if (data.periodStream) S.periodStream = data.periodStream;
  if (data.shotClockStream) S.shotClockStream = data.shotClockStream;

  render();
}

function getEffState() {
  return S;
}

let _lastLocalMsgTime = 0;
let _lastStateMsgTime = 0;

function hasStateNonClockChanged(oldS, newD) {
  if (!oldS || !newD) return true;
  for (const k of [
    'homeScore', 'awayScore', 'homeAbbr', 'awayAbbr', 'homeColor', 'awayColor',
    'homeLogo', 'awayLogo', 'homeLogoThumb', 'awayLogoThumb',
    'quarter', 'possession', 'homeFouls', 'awayFouls'
  ]) {
    if (newD[k] !== undefined && newD[k] !== oldS[k]) return true;
  }
  return false;
}

function applyStateMessage(msgData) {
  _lastStateMsgTime = Date.now();
  if (!msgData) return;
  if (msgData.aiSyncActive !== undefined) aiSyncActive = !!msgData.aiSyncActive;
  if (msgData.aiSyncEnabled !== undefined) aiSyncActive = !!msgData.aiSyncEnabled;
  if (msgData.feedInvert && msgData.feedInvert !== feedInvertMode) {
    setFeedInvertMode(msgData.feedInvert);
  }
  const nonClockChanged = hasStateNonClockChanged(S, msgData);
  S = { ...S, ...msgData };
  if (nonClockChanged) {
    render();
  } else {
    renderClocks();
  }
  syncLocalTick();
}

const bc = new BroadcastChannel('hc_scoreboard_sync');
bc.onmessage = (e) => {
  const msg = e.data;
  if (!msg) return;
  _lastLocalMsgTime = Date.now();
  if (msg.type === 'state') {
    applyStateMessage(msg.data);
  } else if (msg.type === 'stream') {
    applyStreamData(msg.data);
  } else if (msg.type === 'buzz') {
    if (msg.timestamp > _lastBuzzTime) {
      _lastBuzzTime = msg.timestamp;
      if (msg.kind === 'game') playGameBuzzer(); else playShotBuzzer();
    }
  }
};

const DEF = {
  homeScore:0, awayScore:0,
  homeFouls:0, awayFouls:0,
  homeAbbr:'HOME', awayAbbr:'AWAY',
  homeColor:'#f5c842', awayColor:'#c8102e',
  homeLogo:null, awayLogo:null,
  quarter:1, gameSeconds:600, shotSeconds:24,
  gameRunning:false, shotRunning:false,
  possession:null,
};

let S = {...DEF};
let lastHome = -1, lastAway = -1;

let localTick = null;
function startLocalTick(){
  if(localTick) return;
  localTick = setInterval(()=>{
    if(Date.now() - _lastStateMsgTime < 3000) return;
    if(S.gameRunning && S.gameSeconds > 0){ S.gameSeconds--; renderClocks(); }
    if(S.shotRunning && S.shotSeconds > 0){ S.shotSeconds--; renderClocks(); }
  }, 1000);
}
function stopLocalTick(){ clearInterval(localTick); localTick = null; }
function syncLocalTick(){ if(S.gameRunning || S.shotRunning){ startLocalTick(); } else { stopLocalTick(); } }

function renderStreamOrText(elId, streamImgUrl, fallbackText, maxHeightCss) {
  const el = typeof elId === 'string' ? document.getElementById(elId) : elId;
  if (!el) return;
  if (aiSyncActive && streamImgUrl) {
    let img = el.querySelector('img.stream-bin-img');
    if (!img) {
      el.innerHTML = '';
      img = document.createElement('img');
      img.className = 'stream-bin-img';
      img.style.height = maxHeightCss || '100%';
      img.style.maxHeight = maxHeightCss || '100%';
      img.style.maxWidth = '100%';
      img.style.objectFit = 'contain';
      img.style.flexShrink = '0';
      img.style.verticalAlign = 'middle';
      img.style.borderRadius = '0';
      img.style.border = 'none';
      img.style.outline = 'none';
      img.style.background = 'transparent';
      img.style.boxShadow = 'none';
      img.style.padding = '0';
      img.style.margin = '0';
      img.style.boxSizing = 'border-box';
      img.style.display = 'inline-block';
      img.style.pointerEvents = 'none';
      img.onload = function() {
        applyStreamImgStyles(img);
      };
      applyStreamImgStyles(img);
      el.appendChild(img);
    } else {
      img.style.maxHeight = maxHeightCss || '100%';
    }
    if (img.src !== streamImgUrl) {
      img.src = streamImgUrl;
    }
    applyStreamImgStyles(img);
  } else {
    const img = el.querySelector('img.stream-bin-img');
    if (img) {
      el.innerHTML = '';
    }
    const txt = (fallbackText !== null && fallbackText !== undefined) ? String(fallbackText) : '';
    if (el.children.length === 0 && el.textContent !== txt) {
      el.textContent = txt;
    }
  }
}

function renderClocks(){
  const eff = getEffState();
  const clkContainer = document.querySelector('.clock-digits');
  if (clkContainer) {
    if (aiSyncActive && S.gameClockStream) {
      renderStreamOrText(clkContainer, S.gameClockStream, null, '10vw');
    } else {
      const img = clkContainer.querySelector('img.stream-bin-img');
      if (img || !document.getElementById('clkM1')) {
        clkContainer.innerHTML = `
          <div class="clock-digit" id="clkM1">0</div>
          <div class="clock-digit" id="clkM2">0</div>
          <div class="clock-colon">:</div>
          <div class="clock-digit" id="clkS1">0</div>
          <div class="clock-digit" id="clkS2">0</div>
        `;
      }
      let mS = "00", sS = "00";
      if (aiSyncActive && eff.clockStr && eff.clockStr.includes(':')) {
        const parts = eff.clockStr.split(':');
        mS = (parts[0] || '0').padStart(2, '0');
        sS = (parts[1] || '0').padStart(2, '0');
      } else {
        const m = Math.floor(eff.gameSeconds/60);
        const sec = eff.gameSeconds%60;
        mS = m.toString().padStart(2,'0');
        sS = sec.toString().padStart(2,'0');
      }
      document.getElementById('clkM1').textContent = mS[0] || '0';
      document.getElementById('clkM2').textContent = mS[1] || '0';
      document.getElementById('clkS1').textContent = sS[0] || '0';
      document.getElementById('clkS2').textContent = sS[1] || '0';
      const warn = eff.gameSeconds <= 30;
      ['clkM1','clkM2','clkS1','clkS2'].forEach(id => {
        const el = document.getElementById(id);
        if(el){ el.style.color = warn?'#ff3300':'#ffaa00'; el.style.textShadow = warn?'0 0 30px rgba(255,50,0,0.7)':'0 0 40px rgba(255,170,0,0.5)'; }
      });
    }
  }

  const shotText = eff.shotSeconds != null ? eff.shotSeconds : '--';
  renderStreamOrText('shotEl', S.shotClockStream, shotText, '8vw');
  const shotEl = document.getElementById('shotEl');
  if(shotEl){
    const targetUrgent = (eff.shotSeconds !== null && eff.shotSeconds<=5 && eff.shotSeconds > 0);
    if(shotEl.classList.contains('urgent') !== targetUrgent) shotEl.classList.toggle('urgent', targetUrgent);
    const targetZero = (eff.shotSeconds !== null && eff.shotSeconds === 0);
    if(shotEl.classList.contains('zero') !== targetZero) shotEl.classList.toggle('zero', targetZero);
  }
}

function setSafePossLogo(elId, url, abbr, color, isPoss) {
  const el = typeof elId === 'string' ? document.getElementById(elId) : elId;
  if (!el) return;
  if (url) {
    let img = el.querySelector('img');
    if (!img) {
      el.innerHTML = `<img src="${url}" alt="">`;
    } else if (img.getAttribute('src') !== url) {
      img.src = url;
    }
  } else {
    if (!el.querySelector('.poss-logo-ph')) {
      el.innerHTML = `<div class="poss-logo-ph">${(abbr||'').substring(0,3).toUpperCase()}</div>`;
    }
  }
  if (el.dataset.color !== color) {
    el.dataset.color = color;
    el.style.borderColor = color;
  }
  const shadow = isPoss ? `0 0 14px ${color}, 0 0 28px ${color}88` : '';
  if (el.dataset.shadow !== shadow) {
    el.dataset.shadow = shadow;
    el.style.boxShadow = shadow;
  }
}

function render(){
  const eff = getEffState();
  renderClocks();

  const hEl = document.getElementById('homeScoreEl');
  const aEl = document.getElementById('awayScoreEl');
  renderStreamOrText('homeScoreEl', S.homeScoreStream, eff.homeScore, '14vw');
  renderStreamOrText('awayScoreEl', S.awayScoreStream, eff.awayScore, '14vw');
  if(hEl && lastHome>=0 && lastHome!==eff.homeScore){ bump('homeScoreEl'); }
  if(aEl && lastAway>=0 && lastAway!==eff.awayScore){ bump('awayScoreEl'); }
  if((eff.homeScore!==lastHome||eff.awayScore!==lastAway)&&lastHome>=0) flashScreen();
  lastHome=eff.homeScore; lastAway=eff.awayScore;

  const hf = document.getElementById('homeFoulsEl');
  const af = document.getElementById('awayFoulsEl');
  if(hf) hf.textContent = S.homeFouls || 0;
  if(af) af.textContent = S.awayFouls || 0;

  renderStreamOrText('periodEl', S.periodStream, eff.quarter, '6vw');

  const hn = document.getElementById('homeNameEl');
  const gn = document.getElementById('guestNameEl');
  if(hn) hn.textContent = (S.homeAbbr||'HOME').toUpperCase();
  if(gn) gn.textContent = (S.awayAbbr||'AWAY').toUpperCase();

  const hb = document.getElementById('homeBlock');
  const ab = document.getElementById('awayBlock');
  const hc = S.homeColor||'#f5c842';
  const ac = S.awayColor||'#c8102e';
  if(hb && hb.dataset.color !== hc){ hb.dataset.color = hc; hb.style.setProperty('--team-color', hc); }
  if(ab && ab.dataset.color !== ac){ ab.dataset.color = ac; ab.style.setProperty('--team-color', ac); }

  const homeOn = S.possession==='home';
  const awayOn = S.possession==='away';
  document.getElementById('possHome')?.classList.toggle('on', homeOn);
  document.getElementById('possAway')?.classList.toggle('on', awayOn);

  const hLogo = S.homeLogo || S.homeLogoThumb;
  setSafePossLogo('possLogoHome', hLogo, S.homeAbbr || 'HOME', hc, homeOn);

  const aLogo = S.awayLogo || S.awayLogoThumb;
  setSafePossLogo('possLogoAway', aLogo, S.awayAbbr || 'AWAY', ac, awayOn);
}

function bump(id){ const e=document.getElementById(id); if(!e)return; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
function flashScreen(){ const fl=document.getElementById('scoreFlash'); if(!fl)return; fl.classList.remove('flash-anim'); void fl.offsetWidth; fl.classList.add('flash-anim'); }

const AudioCtx = window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function getAudioCtx(){ if(!audioCtx) audioCtx=new AudioCtx(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
document.addEventListener('click',()=>getAudioCtx(),{passive:true});
document.addEventListener('touchstart',()=>getAudioCtx(),{passive:true});

function unlockAudio(){
  getAudioCtx();
  const audio=new Audio('/buzzer.mp3'); audio.volume=0;
  audio.play().then(()=>{ audio.pause(); audio.currentTime=0; }).catch(()=>{});
  document.getElementById('soundUnlock').style.display='none';
}

// Fullscreen
function toggleFullscreen(){
  const btn=document.getElementById('fsBtn');
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); if(btn) btn.textContent='✕'; }
  else { document.exitFullscreen(); if(btn) btn.textContent='⛶'; }
}
document.addEventListener('fullscreenchange',()=>{ const btn=document.getElementById('fsBtn'); if(btn) btn.textContent=document.fullscreenElement?'✕':'⛶'; });

function playGameBuzzer(){ const a=new Audio('/buzzer.mp3'); a.volume=1.0; a.play().catch(()=>{}); }
function playShotBuzzer(){ const a=new Audio('/buzzer.mp3'); a.volume=1.0; a.play().catch(()=>{}); }

let _lastBuzzTime = 0;

function connectSSE(){
  if (useFirebase && db) {
    db.ref(`states/${fbUser}`).on('value', snapshot => {
      if (Date.now() - _lastLocalMsgTime < 2000) return;
      const d = snapshot.val();
      if (!d) return;
      applyStateMessage(d);
    });
    db.ref(`ocr/${fbUser}`).on('value', snapshot => {
      const d = snapshot.val();
      if (d) applyStreamData(d);
    });
    db.ref(`buzz/${fbUser}`).on('value', snapshot => {
      if (Date.now() - _lastLocalMsgTime < 2000) return;
      const msg = snapshot.val();
      if (!msg || msg.timestamp <= _lastBuzzTime) return;
      _lastBuzzTime = msg.timestamp;
      if(msg.kind==='game') playGameBuzzer(); else playShotBuzzer();
    });
    return;
  }
  const es=new EventSource(`${SERVER_URL}/events?user=${encodeURIComponent(currentUser)}`);
  es.onmessage=(e)=>{
    try {
      const msg=JSON.parse(e.data);
      if(msg.type==='buzz'){
        if (Date.now() - _lastLocalMsgTime < 2000) return;
        if(msg.kind==='game') playGameBuzzer(); else playShotBuzzer();
      }
      else if(msg.type==='state'){
        if (Date.now() - _lastLocalMsgTime < 2000) return;
        applyStateMessage(msg.data);
      }
      else if(msg.type==='stream'){
        applyStreamData(msg.data);
      }
    } catch(err){}
  };
  es.onerror=()=>{ es.close(); setTimeout(connectSSE,2000); };
}

if (useFirebase && db) {
  db.ref(`states/${fbUser}`).once('value').then(snapshot => {
    const data = snapshot.val();
    if (data) { S={...DEF,...data}; render(); syncLocalTick(); }
  }).catch(()=>{}).finally(()=>connectSSE());
} else {
  fetch(`${SERVER_URL}/state?user=${encodeURIComponent(currentUser)}`).then(r=>r.json()).then(data=>{
    if(Object.keys(data).length){ S={...DEF,...data}; render(); syncLocalTick(); }
  }).catch(()=>{}).finally(()=>{ connectSSE(); });
}
</script>
