<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Global Storage Shield — prevents WebKit SecurityError exceptions on blocked localStorage/sessionStorage
    (function() {
      try {
        localStorage.setItem('__test_ls__', '1');
        localStorage.removeItem('__test_ls__');
      } catch (e) {
        var store = {};
        Object.defineProperty(window, 'localStorage', {
          value: {
            getItem: function(k) { return store[k] === undefined ? null : store[k]; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          },
          configurable: true, writable: true
        });
      }
      try {
        sessionStorage.setItem('__test_ss__', '1');
        sessionStorage.removeItem('__test_ss__');
      } catch (e) {
        var store = {};
        Object.defineProperty(window, 'sessionStorage', {
          value: {
            getItem: function(k) { return store[k] === undefined ? null : store[k]; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          },
          configurable: true, writable: true
        });
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hoop Culture — Stadium Pill Broadcast Scorebug</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #080605;
      --orange-fire: #e8430a;
      --gold-accent: #ffaa00;
      --away-color: #c8102e;
      --home-color: #f5c842;
      --pill-height: 4.8vw;
      --capsule-bg: radial-gradient(ellipse at center, #1e2029 0%, #0c0d12 60%, #040507 100%);
    }

    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: 'Barlow Condensed', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ════ MAIN CONTAINER: STADIUM PILL SCOREBUG ════ */
    #scorebug-wrapper {
      position: fixed;
      bottom: 2vw;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transition: transform 0.3s ease, bottom 0.3s ease, top 0.3s ease;
    }

    #scorebug {
      display: inline-flex;
      align-items: stretch;
      height: var(--pill-height);
      border-radius: 9999px;
      overflow: hidden;
      background: #08090d;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 0.8vw 2.5vw rgba(0, 0, 0, 0.85), 0 0.2vw 0.5vw rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* ════ 1. VENUE SEGMENT (FAR LEFT END) ════ */
    .seg-venue {
      min-width: 9.2vw;
      max-width: 12.5vw;
      background: linear-gradient(180deg, #181922 0%, #0d0e13 100%);
      border-right: 1.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 1.2vw 0 1.6vw;
      border-radius: 9999px 0 0 9999px;
      flex-shrink: 0;
      position: relative;
    }

    .venue-tag {
      display: flex;
      align-items: center;
      gap: 0.3vw;
      font-size: 0.52vw;
      font-weight: 800;
      letter-spacing: 0.14vw;
      text-transform: uppercase;
      color: #ffaa00;
      line-height: 1;
      margin-bottom: 0.15vw;
    }

    .venue-pulse-dot {
      width: 0.36vw;
      height: 0.36vw;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 0.3vw #ff3b30;
      animation: venuePulse 1.2s infinite alternate;
    }
    @keyframes venuePulse {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 0.5vw #ff3b30; }
    }

    .venue-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95vw;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.05vw;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 10vw;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* ════ 2 & 4. TEAM BANNERS (AWAY ON LEFT, HOME ON RIGHT) ════ */
    .seg-team {
      flex: 1 1 0;
      min-width: 13.5vw;
      max-width: 17.5vw;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 0.9vw;
      gap: 0.6vw;
      position: relative;
      transition: background 0.4s ease;
      overflow: hidden;
    }

    .seg-team.away {
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0.25) 100%), var(--away-color);
      justify-content: flex-start;
      flex-direction: row;
    }

    .seg-team.home {
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0.25) 100%), var(--home-color);
      justify-content: flex-end;
      flex-direction: row;
    }

    /* Team Circular Logo Badges */
    .team-logo-circle {
      width: 3.8vw;
      height: 3.8vw;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0.15vw 0.4vw rgba(0, 0, 0, 0.55));
    }

    .team-logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }

    .team-logo-fallback {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1vw;
      font-weight: 900;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      width: 3.4vw;
      height: 3.4vw;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.05vw;
      text-align: center;
    }

    /* Team Names (Dynamic scaling for 3-letters or full names) */
    .team-name-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    .seg-team.away .team-name-wrap {
      align-items: flex-start;
      text-align: left;
    }

    .seg-team.home .team-name-wrap {
      align-items: flex-end;
      text-align: right;
    }

    .team-name-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1vw, 1.8vw, 2.2vw);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04vw;
      line-height: 0.92;
      color: #ffffff;
      text-shadow: 0 0.15vw 0.5vw rgba(0, 0, 0, 0.85), 0 0.05vw 0.1vw rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      transition: font-size 0.2s ease;
    }

    /* Possession Indicators */
    .poss-arrow {
      width: 0.8vw;
      height: 0.8vw;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      filter: drop-shadow(0 0 0.3vw #ffaa00);
      flex-shrink: 0;
    }
    .poss-arrow.active {
      opacity: 1;
      animation: possBounce 0.8s infinite alternate ease-in-out;
    }
    @keyframes possBounce {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 0.6vw #ffea00); }
    }

    /* ════ 3. CENTER SCORE CAPSULE WITH HOOP CULTURE MEDALLION ════ */
    .seg-score-capsule {
      width: 18.2vw;
      height: calc(100% - 0.4vw);
      margin: 0.2vw 0;
      background: var(--capsule-bg);
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.26);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 1.2vw rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1vw;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .score-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 4.8vw;
    }

    .score-num {
      font-family: 'Teko', sans-serif;
      font-size: 3.5vw;
      font-weight: 700;
      color: #ffffff;
      line-height: 0.82;
      letter-spacing: 0.05vw;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0.1vw 0.4vw rgba(0, 0, 0, 0.8);
      transition: transform 0.15s ease-out, color 0.15s ease-out;
    }

    @keyframes scoreBump {
      0% { transform: scale(1); color: #ffffff; }
      40% { transform: scale(1.22); color: #ffaa00; text-shadow: 0 0 0.8vw #ffaa00; }
      100% { transform: scale(1); color: #ffffff; }
    }
    .score-num.bump {
      animation: scoreBump 0.4s ease-out;
    }

    .bonus-tag {
      font-size: 0.46vw;
      font-weight: 900;
      letter-spacing: 0.14vw;
      text-transform: uppercase;
      color: #ffaa00;
      opacity: 0;
      transition: opacity 0.3s ease;
      line-height: 1;
      margin-top: 0.1vw;
      text-shadow: 0 0 0.3vw rgba(255, 170, 0, 0.6);
    }
    .bonus-tag.active {
      opacity: 1;
    }

    /* Official Hoop Culture Center Medallion (Elevated Chrome Bezel on Bright Brushed Silver Face) */
    .hc-medallion-anchor {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 25;
      margin: 0 -0.2vw;
    }

    .hc-medallion-ring {
      width: 4.6vw;
      height: 4.6vw;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 35%, #94a3b8 70%, #475569 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0.4vw 1.2vw rgba(0, 0, 0, 0.85), inset 0 2px 3px rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0.22vw;
    }

    .hc-medallion-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 48% 36%, #ffffff 0%, #f8fafc 45%, #e2e8f0 85%, #cbd5e1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0.1vw 0.3vw rgba(0, 0, 0, 0.25), 0 0.05vw 0.1vw rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .hc-medallion-logo {
      width: 84%;
      height: 84%;
      object-fit: contain;
      filter: drop-shadow(0 0.12vw 0.25vw rgba(0, 0, 0, 0.3));
    }

    /* ════ 5. CLOCK & SHOT CLOCK SEGMENT (FAR RIGHT END) ════ */
    /* Blends seamlessly with dark score capsule and left venue */
    .seg-clock {
      min-width: 13.5vw;
      background: linear-gradient(180deg, #181922 0%, #0d0e13 100%);
      border-left: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 9999px 9999px 0;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 1.6vw 0 1.2vw;
      flex-shrink: 0;
      gap: 0.8vw;
    }

    .clock-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Period */
    .period-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.25vw;
      font-weight: 900;
      letter-spacing: 0.04vw;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }
    .period-val sup {
      font-size: 0.65em;
      color: #ffaa00;
      margin-left: 0.05vw;
    }

    /* Game Clock */
    .game-clock-val {
      font-family: 'Teko', sans-serif;
      font-size: 2.35vw;
      font-weight: 700;
      color: #ffffff;
      line-height: 0.9;
      letter-spacing: 0.06vw;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0.1vw 0.3vw rgba(0, 0, 0, 0.8);
      min-width: 4.8vw;
      text-align: center;
      transition: color 0.3s ease;
    }
    .game-clock-val.warn {
      color: #ff4d4d;
      text-shadow: 0 0 0.6vw rgba(255, 77, 77, 0.8);
      animation: clkWarnPulse 0.5s infinite alternate;
    }
    @keyframes clkWarnPulse {
      0% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    /* Shot Clock Stadium Box */
    .shot-clock-pill {
      background: #000000;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.4vw;
      padding: 0.1vw 0.55vw;
      box-shadow: inset 0 0 0.3vw rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 2.4vw;
      height: 2.1vw;
    }

    .shot-clock-val {
      font-family: 'Teko', sans-serif;
      font-size: 1.85vw;
      font-weight: 700;
      color: #ffaa00;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .shot-clock-val.urgent {
      color: #ff3b30;
      text-shadow: 0 0 0.6vw #ff0000;
      animation: scPulse 0.45s ease infinite alternate;
    }
    .shot-clock-val.zero {
      color: #ff0000;
      text-shadow: 0 0 0.9vw #ff0000;
      font-weight: 800;
    }
    @keyframes scPulse {
      0% { opacity: 1; }
      100% { opacity: 0.35; }
    }

    /* ════ OPTICAL AI SCANNER STREAM CROPS ════ */
    img.stream-bin-img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: brightness(1.25) contrast(1.25);
      border-radius: 3px;
      display: inline-block;
      vertical-align: middle;
    }
    .game-clock-val img.stream-bin-img {
      height: 2.2vw;
      max-width: 5.8vw;
    }
    .shot-clock-val img.stream-bin-img {
      height: 1.8vw;
      max-width: 2.2vw;
    }
    .period-val img.stream-bin-img {
      height: 1.5vw;
      max-width: 2.4vw;
    }
    .score-num img.stream-bin-img {
      height: 2.8vw;
      max-width: 4.8vw;
    }

    /* ════ FLOATING BROADCAST CONTROLS HUD (Press 'H' to toggle) ════ */
    #hud-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(13, 17, 23, 0.95);
      border: 1.5px solid #2a3040;
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 13px;
      z-index: 9999;
      display: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      font-family: sans-serif;
      max-width: 320px;
    }
    #hud-panel.show { display: block; }
    #hud-panel h4 { margin-bottom: 8px; color: #ffaa00; font-size: 14px; text-transform: uppercase; }
    #hud-panel label { display: block; margin-top: 6px; font-size: 11px; color: #a0a5b5; }
    #hud-panel input, #hud-panel select { width: 100%; background: #161b26; border: 1px solid #3b4252; color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 12px; margin-top: 2px; }
    #hud-panel .btn-row { display: flex; gap: 6px; margin-top: 10px; }
    #hud-panel button { flex: 1; padding: 6px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; cursor: pointer; font-weight: 700; font-size: 12px; }
    #hud-panel button:hover { background: #2563eb; }
  </style>
</head>
<body>

<div id="scorebug-wrapper">
  <div id="scorebug">

    <!-- ① VENUE BLOCK (Far Left - Matches Scripps Sports placement) -->
    <div class="seg-venue">
      <div class="venue-tag">
        <span class="venue-pulse-dot"></span>
        <span id="venueTag">VENUE</span>
      </div>
      <div class="venue-name" id="venueName">AUDLEY</div>
    </div>

    <!-- ② AWAY TEAM (Left Team - Vibrant Team Color Banner) -->
    <div class="seg-team away" id="awayTeamSeg">
      <div class="team-logo-circle" id="awayLogoCircle">
        <div class="team-logo-fallback" id="awayLogoFallback">PIN</div>
      </div>
      <div class="team-name-wrap">
        <div class="team-name-text" id="awayTeamName">PINTURA</div>
      </div>
      <div class="poss-arrow" id="awayPossArrow">
        <svg viewBox="0 0 24 24"><polygon points="6,4 18,12 6,20" fill="#ffffff"/></svg>
      </div>
    </div>

    <!-- ③ CENTER SCORE CAPSULE WITH HOOP CULTURE MEDALLION -->
    <div class="seg-score-capsule">
      <!-- Away Score -->
      <div class="score-block">
        <div class="score-num" id="awayScore">68</div>
        <div class="bonus-tag" id="awayBonus">BONUS</div>
      </div>

      <!-- Center Hoop Culture Official Medallion -->
      <div class="hc-medallion-anchor" title="Hoop Culture Basketball Network">
        <div class="hc-medallion-ring">
          <div class="hc-medallion-inner">
            <img src="/hoop-culture-logo2.png" alt="Hoop Culture Logo" class="hc-medallion-logo" onerror="this.onerror=null;this.src='/hoop-culture-logo-256.png';">
          </div>
        </div>
      </div>

      <!-- Home Score -->
      <div class="score-block">
        <div class="score-num" id="homeScore">57</div>
        <div class="bonus-tag" id="homeBonus">BONUS</div>
      </div>
    </div>

    <!-- ④ HOME TEAM (Right Team - Symmetrical Vibrant Team Color Banner) -->
    <div class="seg-team home" id="homeTeamSeg">
      <div class="poss-arrow" id="homePossArrow">
        <svg viewBox="0 0 24 24"><polygon points="18,4 6,12 18,20" fill="#ffffff"/></svg>
      </div>
      <div class="team-name-wrap">
        <div class="team-name-text" id="homeTeamName">FREEDOM</div>
      </div>
      <div class="team-logo-circle" id="homeLogoCircle">
        <div class="team-logo-fallback" id="homeLogoFallback">FRE</div>
      </div>
    </div>

    <!-- ⑤ PERIOD · GAME CLOCK · SHOT CLOCK (Far Right - Blends seamlessly into dark theme) -->
    <div class="seg-clock">
      <!-- Period -->
      <div class="clock-col">
        <div class="period-val" id="periodVal">1<sup>ST</sup></div>
      </div>

      <!-- Game Time -->
      <div class="clock-col">
        <div class="game-clock-val" id="gameClockVal">10:00</div>
      </div>

      <!-- Shot Clock -->
      <div class="clock-col">
        <div class="shot-clock-pill">
          <div class="shot-clock-val" id="shotClockVal">14</div>
        </div>
      </div>
    </div>

  </div><!-- /#scorebug -->
</div><!-- /#scorebug-wrapper -->

<!-- Operator Test HUD Panel (Toggle with 'H' key) -->
<div id="hud-panel">
  <h4>⚙ Scorebug Controls</h4>
  <p style="font-size:11px;color:#8a95a8;margin-bottom:8px;">Press <strong>H</strong> anytime to show/hide this panel.</p>
  <label>Venue Name:</label>
  <input type="text" id="hudVenue" value="HOOP CULTURE ARENA" oninput="overrideVenue(this.value)">
  <label>Scorebug Position:</label>
  <select id="hudPos" onchange="overridePos(this.value)">
    <option value="bottom">Bottom Center</option>
    <option value="top">Top Center</option>
  </select>
  <label>Scale Factor:</label>
  <input type="range" min="0.6" max="1.5" step="0.05" value="1.0" oninput="overrideScale(this.value)">
  <div class="btn-row">
    <button onclick="toggleSwap()">⇄ Swap Home/Away</button>
  </div>
</div>

<script>
'use strict';

/* ══ CONFIGURATION & SERVER DISCOVERY ══ */
const isLocalServer = window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1' ||
                      window.location.hostname.startsWith('192.168.') ||
                      window.location.hostname.startsWith('10.');

const useFirebase = (typeof isFirebaseConfigured !== 'undefined' && isFirebaseConfigured) && !isLocalServer;

const SERVER_URL = useFirebase
  ? 'https://scoreboard.hoopculture.ca'
  : (window.location.protocol === 'file:' ? 'http://localhost:3000' : '');

let db = null;
if (useFirebase && typeof firebase !== 'undefined' && isFirebaseConfigured) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.error("Firebase init failed:", e);
  }
}

function gP(n) { return new URLSearchParams(window.location.search).get(n); }

// Robust user detection (URL param -> localStorage -> Cookie)
let userParam = gP('user');
let sessionUser = localStorage.getItem('hc_session_user');
if (!sessionUser) {
  try {
    const match = document.cookie.match(new RegExp('(^| )hc_session_user=([^;]+)'));
    if (match && match[2]) sessionUser = decodeURIComponent(match[2]);
  } catch(e) {}
}

let currentUser = userParam || sessionUser || '';
// If user param was literally 'default', treat as blank so auto-detection finds the active game
if (currentUser === 'default') currentUser = '';
let fbUser = currentUser ? currentUser.replace(/[\.\#\$\[\]]/g, '_') : '';

// URL Customization flags
let isSwapped = gP('swap') === '1' || gP('homeleft') === '1';
const customVenueParam = gP('venue');
const posParam = gP('pos') || 'bottom';
const scaleParam = parseFloat(gP('scale') || '1.0');

/* ══ STATE DEFINITION ══ */
const DEFAULT_STATE = {
  homeScore: 57,
  awayScore: 68,
  homeAbbr: 'FREEDOM',
  awayAbbr: 'PINTURA',
  homeName: 'FREEDOM',
  awayName: 'PINTURA',
  homeColor: '#f5c842',
  awayColor: '#c8102e',
  homeLogo: '',
  awayLogo: '',
  homeLogoThumb: '',
  awayLogoThumb: '',
  gameClockStream: null,
  shotClockStream: null,
  homeScoreStream: null,
  awayScoreStream: null,
  periodStream: null,
  homeFouls: 0,
  awayFouls: 0,
  homeBonus: false,
  awayBonus: false,
  gameSeconds: 600,
  gameRunning: false,
  shotSeconds: 14,
  shotRunning: false,
  quarter: 1,
  possession: null,
  venue: 'AUDLEY',
  rp1Value: 'Facebook',
  rp2Value: 'Audley',
  aiSyncEnabled: true
};

let S = { ...DEFAULT_STATE };
let aiSyncActive = false;
let aiState = { gameSeconds: null, clockStr: null, homeScore: null, awayScore: null, quarter: null, shotSeconds: null };
let lastHomeScore = -1;
let lastAwayScore = -1;

// Immediate Local Storage Hydration (Same Browser Zero Latency)
try {
  const localRaw = localStorage.getItem('bball_v3');
  if (localRaw) {
    const local = JSON.parse(localRaw);

// Listen for local scoreboard updates across tabs on the same machine
window.addEventListener('storage', (e) => {

});

// Fast initial REST fetch: immediately fetch active game data & OCR stream with zero SSL delay
const targetInitRoom = fbUser || 'isidro_pascua@gmail_com';
fetch(`https://hoop-culture-scoreboard-default-rtdb.firebaseio.com/states/${targetInitRoom}.json`)

fetch(`https://hoop-culture-scoreboard-default-rtdb.firebaseio.com/ocr/${targetInitRoom}.json`)

/* ══ DOM HELPER ══ */
function $(id) { return document.getElementById(id); }

/* Apply Positioning & Scale */
function applyLayoutOptions() {
  const wrap = $('scorebug-wrapper');
  if (!wrap) return;
  if (posParam === 'top') {
    wrap.style.bottom = 'auto';
    wrap.style.top = '2vw';
  } else {
    wrap.style.top = 'auto';
    wrap.style.bottom = '2vw';
  }
  if (!isNaN(scaleParam) && scaleParam !== 1.0) {
    wrap.style.transform = `translateX(-50%) scale(${scaleParam})`;

applyLayoutOptions();

/* ══ RENDER SCOREBUG ══ */
function renderAll() {
  renderVenue();
  renderTeams();
  renderScores();
  renderClock();
  renderShotClock();
}

/* 1. Venue */
function renderVenue() {
  const el = $('venueName');
  if (!el) return;
  let text = 'AUDLEY';
  if (customVenueParam) {
    text = customVenueParam.toUpperCase();
  } else if (S.rp2Value && S.rp2Value !== '—') {
    text = S.rp2Value.trim().toUpperCase();
  } else if (S.venue && S.venue.trim() && S.venue.trim().toUpperCase() !== 'HOOP CULTURE ARENA') {
    text = S.venue.trim().toUpperCase();
  } else if (S.rp1Value && S.rp1Value !== '—' && S.rp1Value.toLowerCase() !== 'facebook') {
    text = S.rp1Value.trim().toUpperCase();
  } else if (S.venue && S.venue.trim()) {
    text = S.venue.trim().toUpperCase();
  }
  if (el.textContent !== text) el.textContent = text;
}

/* 2. Teams (Names, Colors, Logos, Possession) */
function renderTeams() {
  // Determine Left Team (Away by default) and Right Team (Home by default)
  const leftTeamKey  = isSwapped ? 'home' : 'away';
  const rightTeamKey = isSwapped ? 'away' : 'home';

  const leftColor  = S[leftTeamKey + 'Color'] || (isSwapped ? '#f5c842' : '#c8102e');
  const rightColor = S[rightTeamKey + 'Color'] || (isSwapped ? '#c8102e' : '#f5c842');

  const leftName  = (S[leftTeamKey + 'Name'] || S[leftTeamKey + 'Abbr'] || (isSwapped ? 'FREEDOM' : 'PINTURA')).toUpperCase();
  const rightName = (S[rightTeamKey + 'Name'] || S[rightTeamKey + 'Abbr'] || (isSwapped ? 'PINTURA' : 'FREEDOM')).toUpperCase();

  const leftLogo  = S[leftTeamKey + 'Logo'] || S[leftTeamKey + 'LogoThumb'] || '';
  const rightLogo = S[rightTeamKey + 'Logo'] || S[rightTeamKey + 'LogoThumb'] || '';

  // Apply Colors to CSS Variables
  document.documentElement.style.setProperty('--away-color', leftColor);
  document.documentElement.style.setProperty('--home-color', rightColor);

  // Team Names
  const leftNameEl = $('awayTeamName');
  if (leftNameEl && leftNameEl.textContent !== leftName) {
    leftNameEl.textContent = leftName;
    adjustTeamFontSize(leftNameEl, leftName);
  }

  const rightNameEl = $('homeTeamName');
  if (rightNameEl && rightNameEl.textContent !== rightName) {
    rightNameEl.textContent = rightName;
    adjustTeamFontSize(rightNameEl, rightName);
  }

  // Logos
  setLogoBadge('awayLogoCircle', 'awayLogoFallback', leftLogo, leftName.slice(0, 3));
  setLogoBadge('homeLogoCircle', 'homeLogoFallback', rightLogo, rightName.slice(0, 3));

  // Possession
  const leftPossArrow = $('awayPossArrow');
  const rightPossArrow = $('homePossArrow');
  if (leftPossArrow && rightPossArrow) {
    const isLeftPoss = S.possession === leftTeamKey;
    const isRightPoss = S.possession === rightTeamKey;
    leftPossArrow.classList.toggle('active', isLeftPoss);
    rightPossArrow.classList.toggle('active', isRightPoss);
  }

  // Bonus Indicator (< 5 fouls = off, >= 5 fouls = on)
  const leftBonusEl = $('awayBonus');
  const rightBonusEl = $('homeBonus');
  if (leftBonusEl && rightBonusEl) {
    const leftFouls = S[leftTeamKey + 'Fouls'] || 0;
    const rightFouls = S[rightTeamKey + 'Fouls'] || 0;
    const leftBonus = S[leftTeamKey + 'Bonus'] || leftFouls >= 5;
    const rightBonus = S[rightTeamKey + 'Bonus'] || rightFouls >= 5;
    leftBonusEl.classList.toggle('active', leftBonus);
    rightBonusEl.classList.toggle('active', rightBonus);
  }
}

function adjustTeamFontSize(el, text) {
  if (!el) return;
  const len = text.length;
  if (len <= 4) {
    el.style.fontSize = '2.1vw';
  } else if (len <= 7) {
    el.style.fontSize = '1.8vw';
  } else if (len <= 11) {
    el.style.fontSize = '1.4vw';
  } else {
    el.style.fontSize = '1.1vw';
  }
}

function setLogoBadge(circleId, fallbackId, logoUrl, fallbackAbbr) {
  const circle = $(circleId);
  if (!circle) return;
  const abbr = (fallbackAbbr || 'HC').toUpperCase();
  if (logoUrl) {
    let img = circle.querySelector('img');
    if (!img) {
      circle.innerHTML = `
        <img src="${logoUrl}" alt="${abbr}" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';">
        <div class="team-logo-fallback" style="display:none;">${abbr}</div>
      `;
    } else if (img.getAttribute('src') !== logoUrl) {
      img.src = logoUrl;
      img.style.display = 'block';
      const fb = circle.querySelector('.team-logo-fallback');
      if (fb) fb.style.display = 'none';
    }
  } else {
    circle.innerHTML = `<div class="team-logo-fallback" style="display:flex;">${abbr}</div>`;
  }
}

/* Helper to render optical stream images or digital text */
function renderStreamOrText(el, streamImgUrl, fallbackText, maxHeightCss) {
  if (typeof el === 'string') el = $(el);
  if (!el) return;
  if (aiSyncActive && streamImgUrl) {
    let img = el.querySelector('img.stream-bin-img');
    if (!img) {
      el.innerHTML = '';
      img = document.createElement('img');
      img.className = 'stream-bin-img';
      if (maxHeightCss) img.style.maxHeight = maxHeightCss;
      el.appendChild(img);
    } else if (maxHeightCss) {
      img.style.maxHeight = maxHeightCss;
    }
    if (img.getAttribute('src') !== streamImgUrl) {
      img.src = streamImgUrl;
    }
  } else {
    const img = el.querySelector('img.stream-bin-img');
    if (img) el.innerHTML = '';
    const txt = (fallbackText !== null && fallbackText !== undefined) ? String(fallbackText) : '';
    if (el.children.length === 0 && el.textContent !== txt) {
      el.textContent = txt;
    }
  }
}

/* 3. Scores */
function renderScores() {
  const leftTeamKey  = isSwapped ? 'home' : 'away';
  const rightTeamKey = isSwapped ? 'away' : 'home';

  const leftScore  = aiSyncActive && aiState.homeScore !== null ? (isSwapped ? aiState.homeScore : aiState.awayScore) : (S[leftTeamKey + 'Score'] !== undefined ? S[leftTeamKey + 'Score'] : 0);
  const rightScore = aiSyncActive && aiState.awayScore !== null ? (isSwapped ? aiState.awayScore : aiState.homeScore) : (S[rightTeamKey + 'Score'] !== undefined ? S[rightTeamKey + 'Score'] : 0);

  const leftStream  = aiSyncActive ? (isSwapped ? S.homeScoreStream : S.awayScoreStream) : null;
  const rightStream = aiSyncActive ? (isSwapped ? S.awayScoreStream : S.homeScoreStream) : null;

  const leftScoreEl = $('awayScore');
  if (leftScoreEl) {
    if (leftStream && (aiState.awayScore == null && aiState.homeScore == null)) {
      renderStreamOrText(leftScoreEl, leftStream, String(leftScore), '2.8vw');
    } else {
      const img = leftScoreEl.querySelector('img.stream-bin-img');
      if (img) leftScoreEl.innerHTML = '';
      const sStr = String(leftScore);
      if (leftScoreEl.textContent !== sStr) {
        leftScoreEl.textContent = sStr;
        if (lastHomeScore !== -1) triggerBump(leftScoreEl);
      }
    }
  }

  const rightScoreEl = $('homeScore');
  if (rightScoreEl) {
    if (rightStream && (aiState.awayScore == null && aiState.homeScore == null)) {
      renderStreamOrText(rightScoreEl, rightStream, String(rightScore), '2.8vw');
    } else {
      const img = rightScoreEl.querySelector('img.stream-bin-img');
      if (img) rightScoreEl.innerHTML = '';
      const sStr = String(rightScore);
      if (rightScoreEl.textContent !== sStr) {
        rightScoreEl.textContent = sStr;
        if (lastAwayScore !== -1) triggerBump(rightScoreEl);
      }
    }
  }

  lastHomeScore = leftScore;
  lastAwayScore = rightScore;
}

function triggerBump(el) {
  if (!el) return;
  el.classList.remove('bump');
  void el.offsetWidth; // Trigger reflow
  el.classList.add('bump');
}

/* 4. Game Clock & Period */
function renderClock() {
  const clkEl = $('gameClockVal');
  const perEl = $('periodVal');
  if (!clkEl || !perEl) return;

  // Period
  const q = aiSyncActive && aiState.quarter !== null ? aiState.quarter : (S.quarter || 1);
  let pText = '1<sup>ST</sup>';
  if (q === 1) pText = '1<sup>ST</sup>';
  else if (q === 2) pText = '2<sup>ND</sup>';
  else if (q === 3) pText = '3<sup>RD</sup>';
  else if (q === 4) pText = '4<sup>TH</sup>';
  else if (q === 5) pText = 'OT';
  else if (q > 5) pText = `${q - 4}OT`;

  if (aiSyncActive && S.periodStream) {
    renderStreamOrText(perEl, S.periodStream, pText, '1.6vw');
  } else {
    const pImg = perEl.querySelector('img.stream-bin-img');
    if (pImg) perEl.innerHTML = '';
    if (perEl.innerHTML !== pText) perEl.innerHTML = pText;
  }

  // Clock Text Calculation
  let cStr = '10:00';
  let secs = S.gameSeconds;
  if (aiSyncActive && aiState.clockStr) {
    cStr = aiState.clockStr;
  } else if (secs !== undefined && secs !== null) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    if (secs < 60) {
      cStr = `${secs}.0`;
    } else {
      cStr = `${m}:${s.toString().padStart(2, '0')}`;
    }
  }

  // Optical Feed or Digital Text
  if (aiSyncActive && S.gameClockStream) {
    renderStreamOrText(clkEl, S.gameClockStream, cStr, '2.3vw');
    clkEl.classList.remove('warn');
  } else {
    const img = clkEl.querySelector('img.stream-bin-img');
    if (img) clkEl.innerHTML = '';
    if (clkEl.textContent !== cStr) clkEl.textContent = cStr;
    const isWarn = secs !== undefined && secs !== null && secs < 60;
    clkEl.classList.toggle('warn', isWarn);
  }
}

/* 5. Shot Clock */
function renderShotClock() {
  const scEl = $('shotClockVal');
  if (!scEl) return;
  const s = aiSyncActive && aiState.shotSeconds !== null ? aiState.shotSeconds : (S.shotSeconds !== undefined ? S.shotSeconds : 24);
  const sStr = String(s);

  if (aiSyncActive && S.shotClockStream) {
    renderStreamOrText(scEl, S.shotClockStream, sStr, '1.8vw');
    scEl.classList.remove('urgent');
    scEl.classList.remove('zero');
  } else {
    const img = scEl.querySelector('img.stream-bin-img');
    if (img) scEl.innerHTML = '';
    if (scEl.textContent !== sStr) scEl.textContent = sStr;
    scEl.classList.toggle('urgent', s <= 5 && s > 0);
    scEl.classList.toggle('zero', s === 0);
  }
}

/* ══ REALTIME DATA SYNCHRONIZATION ══ */
let _lastStateMsgTime = 0;

function applyStateMessage(msgData) {
  if (!msgData) return;
  _lastStateMsgTime = Date.now();
  if (msgData.aiSyncActive !== undefined) aiSyncActive = !!msgData.aiSyncActive;
  if (msgData.aiSyncEnabled !== undefined) aiSyncActive = !!msgData.aiSyncEnabled;
  S = { ...S, ...msgData };
  renderAll();
  syncLocalTimers();
}

function applyStreamData(streamData) {
  if (!streamData) return;
  if (streamData.streamActive === false) {
    aiSyncActive = false;
    S.gameClockStream = null;
    S.shotClockStream = null;
    S.homeScoreStream = null;
    S.awayScoreStream = null;
    S.periodStream = null;
    renderAll();
    return;
  }
  aiSyncActive = true;

  if (streamData.clock != null) {
    const cStr = String(streamData.clock).trim();
    aiState.clockStr = cStr;
    if (cStr.includes(':')) {
      const parts = cStr.split(':');
      aiState.gameSeconds = (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    } else {
      const p = parseFloat(cStr);
      if (!isNaN(p)) aiState.gameSeconds = Math.round(p);
    }
  }
  if (streamData.homeScore != null && !isNaN(parseInt(streamData.homeScore, 10))) aiState.homeScore = parseInt(streamData.homeScore, 10);
  if (streamData.awayScore != null && !isNaN(parseInt(streamData.awayScore, 10))) aiState.awayScore = parseInt(streamData.awayScore, 10);
  if (streamData.period != null && !isNaN(parseInt(streamData.period, 10))) aiState.quarter = parseInt(streamData.period, 10);
  if (streamData.shotClock != null && !isNaN(parseInt(streamData.shotClock, 10))) aiState.shotSeconds = parseInt(streamData.shotClock, 10);

  if (streamData.gameClockStream) S.gameClockStream = streamData.gameClockStream;
  if (streamData.shotClockStream) S.shotClockStream = streamData.shotClockStream;
  if (streamData.homeScoreStream) S.homeScoreStream = streamData.homeScoreStream;
  if (streamData.awayScoreStream) S.awayScoreStream = streamData.awayScoreStream;
  if (streamData.periodStream) S.periodStream = streamData.periodStream;

  renderAll();
}

/* Local clock tickers for smooth continuous decrement between network pulses */
let gameTimer = null, shotTimer = null;
function syncLocalTimers() {
  clearInterval(gameTimer);
  clearInterval(shotTimer);

  if (S.gameRunning) {
    gameTimer = setInterval(() => {
      if (Date.now() - _lastStateMsgTime < 2500) return;
      if (S.gameSeconds > 0) {
        S.gameSeconds--;
        renderClock();
      } else {
        clearInterval(gameTimer);
      }
    }, 1000);
  }

  if (S.shotRunning) {
    shotTimer = setInterval(() => {
      if (Date.now() - _lastStateMsgTime < 2500) return;
      if (S.shotSeconds > 0) {
        S.shotSeconds--;
        renderShotClock();
      } else {
        clearInterval(shotTimer);
      }
    }, 1000);
  }
}

// 1. BroadcastChannels
function setupBroadcastChannels() {
  if (typeof BroadcastChannel === 'undefined') return;
  ['hc_scoreboard_sync', 'basketball_scoreboard', 'ezlive_scoreboard_channel', 'ocr_stream'].forEach(chName => {
    try {
      const bc = new BroadcastChannel(chName);
      bc.onmessage = (e) => {
        if (!e || !e.data) return;
        if (e.data.type === 'state') applyStateMessage(e.data.data);
        else if (e.data.type === 'stream' || e.data.type === 'ocr') applyStreamData(e.data.data || e.data);
        else if (e.data.gameClockStream || e.data.shotClockStream) applyStreamData(e.data);
        else if (e.data.homeScore !== undefined || e.data.gameSeconds !== undefined) applyStateMessage(e.data);
      };
    } catch(err) {}
  });
}
setupBroadcastChannels();

// 2. Window PostMessage (for OBS Browser Source / iframe embedding)
window.addEventListener('message', (e) => {
  if (!e || !e.data) return;
  if (e.data.type === 'state') applyStateMessage(e.data.data);
  else if (e.data.type === 'stream' || e.data.type === 'ocr') applyStreamData(e.data.data || e.data);
  else if (e.data.gameClockStream || e.data.shotClockStream) applyStreamData(e.data);
  else if (e.data.homeScore !== undefined || e.data.gameSeconds !== undefined) applyStateMessage(e.data);
});

// 3. Firebase Realtime Sync
if (useFirebase && db) {
  function listenToRoom(roomKey) {
    if (!roomKey) return;
    fbUser = roomKey;
    console.log('[Scripps Overlay] Listening to room:', roomKey);

    // Initial state fetch from authoritative scoreboard path
    db.ref(`states/${roomKey}`).once('value').then(snap => {
      const val = snap.val();
      if (val) {
        applyStateMessage(val);
      }
    }).catch(e => console.error("Firebase fetch error:", e));

    // Live state listener
    db.ref(`states/${roomKey}`).on('value', snap => {
      const val = snap.val();
      if (val) applyStateMessage(val);
    });

    // Live optical scanner stream (listen to both exact roomKey and underscore-replaced variant)
    const ocrKeys = [roomKey];
    if (roomKey.includes('@')) ocrKeys.push(roomKey.replace(/@/g, '_'));
    ocrKeys.forEach(p => {
      db.ref(`ocr/${p}`).once('value').then(snap => {
        const d = snap.val();
        if (d) applyStreamData(d);
      }).catch(() => {});

      db.ref(`ocr/${p}`).on('value', snap => {
        const d = snap.val();
        if (d) applyStreamData(d);
      });
    });

    // Also listen to any OCR child updates matching user prefix
    const baseEmail = roomKey.split('@')[0];
    db.ref('ocr').on('child_changed', snap => {
      if (snap.key.startsWith(baseEmail) || snap.key === roomKey) {
        applyStreamData(snap.val());
      }
    });

    // Live buzzer / horn listener
    db.ref(`buzz/${roomKey}`).on('value', snap => {
      const b = snap.val();
      if (b && b.active) {
        // Horn triggered
      }
    });
  }

  if (fbUser && fbUser !== 'default') {
    listenToRoom(fbUser);
  } else {
    // Auto-discover the active scoreboard room in Firebase RTDB
    db.ref('states').once('value').then(snap => {
      const all = snap.val();
      if (!all) {
        listenToRoom('isidro_pascua@gmail_com');
        return;
      }
      const keys = Object.keys(all).filter(k => k !== 'default' && k !== 'ezlive_profiles');
      if (keys.length === 0) {
        listenToRoom('isidro_pascua@gmail_com');
        return;
      }

      let bestKey = null;
      let highestScore = -1;

      keys.forEach(k => {
        const room = all[k];
        if (!room || typeof room !== 'object') return;
        let score = 0;
        if ((room.awayScore || 0) > 0 || (room.homeScore || 0) > 0) score += 1000;
        if (room.awayAbbr && room.awayAbbr !== 'AWAY') score += 500;
        if (room.homeAbbr && room.homeAbbr !== 'HOME') score += 500;
        if (room.gameRunning || room.shotRunning) score += 200;
        if (k === 'isidro_pascua@gmail_com') score += 2000;
        const ts = room.shotLeaderTime || room.lastUpdate || 0;
        if (ts > 0) score += Math.min(500, Math.floor(ts / 10000000000));

        if (score > highestScore) {
          highestScore = score;
          bestKey = k;
        }
      });

      const selectedRoom = bestKey || 'isidro_pascua@gmail_com';
      listenToRoom(selectedRoom);
    }).catch(err => {
      console.warn("Auto-discovery fallback to isidro_pascua@gmail_com:", err);
      listenToRoom('isidro_pascua@gmail_com');
    });
  }
}

// 4. SSE Server Fallback
function connectSSE() {
  if (!SERVER_URL) return;
  fetch(`${SERVER_URL}/state?user=${encodeURIComponent(currentUser)}`)
    .then(r => r.json())
    .then(d => {
      if (d && Object.keys(d).length) {
        S = { ...DEFAULT_STATE, ...d };
        renderAll();
        syncLocalTimers();
      }
    }).catch(() => {});

  try {
    const es = new EventSource(`${SERVER_URL}/events?user=${encodeURIComponent(currentUser)}`);
    es.onmessage = (e) => {
      try {
        const m = JSON.parse(e.data);
        if (m.type === 'state') applyStateMessage(m.data);
        else if (m.type === 'stream') applyStreamData(m.data);
      } catch(err) {}
    };
  } catch(err) {}
}
if (!useFirebase) connectSSE();

// Local tick timer for smooth clock updates
setInterval(() => {
  if (S.clockRunning && S.gameSeconds > 0) {
    // Ticker handled by master scoreboard, but render updates smoothly
    renderClock();
  }
}, 250);

  if (val === 'top') {
    wrap.style.bottom = 'auto';
    wrap.style.top = '2vw';
  } else {
    wrap.style.top = 'auto';
    wrap.style.bottom = '2vw';
  }
}

function overrideScale(val) {
  const wrap = $('scorebug-wrapper');
  if (!wrap) return;
  wrap.style.transform = `translateX(-50%) scale(${val})`;
}

function toggleSwap() {
  isSwapped = !isSwapped;
  renderAll();
}

// Initial draw
renderAll();
</script>
</body>
</html>
